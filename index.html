<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendário da Angela</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4A1F6E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Angela">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&family=Playfair+Display:ital@0;1&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #F9F2FF;
      --surface:     #F3EAFD;
      --purple-deep: #4A1F6E;
      --purple-mid:  #7B3FA0;
      --purple:      #9B59C4;
      --purple-soft: #C89EE0;
      --purple-pale: #EDD9FA;
      --pink:        #E879A8;
      --pink-pale:   #FCE4F1;
      --border:      #E2C8F5;
      --text:        #2E1445;
      --muted:       #9A7BB5;
      --sidebar-w:   260px;
      --radius:      12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 14px;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      padding: 0 24px;
      height: 62px;
      background: linear-gradient(135deg, var(--purple-deep) 0%, var(--purple-mid) 100%);
      gap: 20px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    /* subtle dot pattern in header */
    header::before {
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 18px 18px;
      pointer-events: none;
    }

    .brand {
      font-family: 'Dancing Script', cursive;
      font-size: 32px;
      color: #fff;
      letter-spacing: 0.02em;
      white-space: nowrap;
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 12px rgba(232,121,168,0.4), 0 1px 0 rgba(255,255,255,0.15);
      line-height: 1;
      display: flex; align-items: center; gap: 10px;
    }
    .brand em { font-style: italic; color: #F9C4E8; }
    .brand svg { opacity: 0.85; flex-shrink: 0; }

    .header-center {
      display: flex; align-items: center; gap: 10px;
      margin-left: 28px; position: relative; z-index: 1;
    }
    #month-label {
      font-size: 16px; font-weight: 700; color: #fff;
      min-width: 200px; letter-spacing: 0.01em;
    }
    .btn-nav {
      width: 32px; height: 32px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.85);
      border-radius: 50%; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .btn-nav:hover { background: rgba(255,255,255,0.25); color: #fff; }

    .btn-today {
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      color: #fff; cursor: pointer; font-size: 12px;
      font-family: inherit; font-weight: 700;
      transition: background 0.15s; position: relative; z-index: 1;
    }
    .btn-today:hover { background: rgba(255,255,255,0.28); }

    .header-right {
      display: flex; align-items: center; gap: 5px;
      margin-left: auto; position: relative; z-index: 1;
    }
    .view-btn {
      padding: 8px 20px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.75);
      cursor: pointer; font-size: 15px; font-weight: 700;
      font-family: inherit; transition: background 0.15s, color 0.15s;
    }
    .view-btn:hover { background: rgba(255,255,255,0.22); color: #fff; }
    .view-btn.active { background: var(--pink); border-color: var(--pink); color: #fff; }

    /* ── LAYOUT ── */
    .app-body { display: flex; flex: 1; overflow: hidden; }

    /* ── SIDEBAR ── */
    aside {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 16px;
      overflow-y: auto;
      flex-shrink: 0;
      display: flex; flex-direction: column; gap: 22px;
    }

    .btn-add {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 16px; border-radius: 24px;
      background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 100%);
      border: none; cursor: pointer;
      font-size: 13px; font-weight: 800; font-family: inherit;
      color: #fff; letter-spacing: 0.03em;
      box-shadow: 0 4px 14px rgba(155,89,196,0.35);
      transition: transform 0.1s, box-shadow 0.15s;
      width: 100%;
    }
    .btn-add:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(155,89,196,0.45); }
    .btn-add:active { transform: scale(0.97); }
    .btn-add svg { flex-shrink: 0; }

    /* mini calendar */
    .mini-cal { user-select: none; }
    .mini-cal-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
    }
    .mini-cal-label { font-size: 12px; font-weight: 800; color: var(--purple-mid); }
    .mini-nav {
      background: none; border: none; cursor: pointer;
      color: var(--purple-soft); padding: 4px;
      border-radius: 50%; line-height: 1; transition: background 0.1s;
      display: flex; align-items: center; justify-content: center;
    }
    .mini-nav:hover { background: var(--purple-pale); color: var(--purple-mid); }
    .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
    .mini-dow { font-size: 10px; color: var(--purple-soft); text-align: center; padding: 3px 0; font-weight: 700; }
    .mini-day {
      font-size: 11px; text-align: center;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      margin: auto; border-radius: 50%; cursor: pointer; color: var(--text);
      font-weight: 600; transition: background 0.1s;
    }
    .mini-day:hover { background: var(--purple-pale); }
    .mini-day.today { background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff; font-weight: 800; }
    .mini-day.selected { background: var(--purple-pale); color: var(--purple-mid); font-weight: 800; }
    .mini-day.other-month { color: #D5B8EC; }

    /* upcoming */
    .sidebar-section-header {
      display: flex; align-items: center; gap: 6px; margin-bottom: 10px;
    }
    .sidebar-section-header h3 {
      font-size: 11px; font-weight: 800; color: var(--purple-mid);
      text-transform: uppercase; letter-spacing: 0.07em;
    }
    .upcoming-item {
      padding: 8px 10px; border-radius: var(--radius);
      margin-bottom: 6px; border-left: 3px solid var(--pink);
      background: var(--pink-pale); cursor: pointer;
      transition: background 0.12s;
    }
    .upcoming-item:hover { background: #F8D0EC; }
    .upcoming-item .ev-title { font-weight: 700; font-size: 12px; color: var(--text); }
    .upcoming-item .ev-time { color: var(--muted); font-size: 11px; margin-top: 1px; }
    .upcoming-empty { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

    /* ── MAIN ── */
    main { flex: 1; overflow: auto; display: flex; flex-direction: column; }

    /* Month view */
    #view-month { flex: 1; display: flex; flex-direction: column; }
    .cal-dow-row {
      display: grid; grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .cal-dow {
      text-align: center; font-size: 11px; font-weight: 800;
      color: var(--purple-mid); padding: 10px 0;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); flex: 1; }
    .cal-cell {
      border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
      padding: 6px 8px; min-height: 108px;
      background: var(--surface); cursor: pointer; transition: background 0.1s;
    }
    .cal-cell:hover { background: var(--bg); }
    .cal-cell.other-month { background: #FAF4FF; }
    .cal-cell.other-month .day-num { color: #D5B8EC; }
    .cal-cell.today .day-num {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff; border-radius: 50%;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center; font-weight: 800;
    }
    .day-num {
      font-size: 12px; font-weight: 700; color: var(--purple-mid);
      width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    }
    .cal-events { margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
    .cal-ev {
      font-size: 11px; padding: 2px 7px; border-radius: 10px;
      color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer; font-weight: 600;
    }
    .cal-ev-more { font-size: 10px; color: var(--muted); padding: 1px 4px; font-weight: 700; }

    /* Week view */
    #view-week { flex: 1; display: none; flex-direction: column; }
    .week-header-row {
      display: grid; grid-template-columns: 56px repeat(7, 1fr);
      border-bottom: 1px solid var(--border); background: var(--surface);
      position: sticky; top: 0; z-index: 2;
    }
    .week-header-cell { text-align: center; padding: 10px 4px; }
    .week-header-cell .wday { font-size: 10px; color: var(--purple-soft); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 800; }
    .week-header-cell .wnum { font-size: 22px; font-weight: 300; color: var(--purple-mid); line-height: 1.2; }
    .week-header-cell.today .wnum {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff; border-radius: 50%; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      margin: auto; font-weight: 800; font-size: 18px;
    }
    .week-body { display: grid; grid-template-columns: 56px repeat(7, 1fr); flex: 1; overflow-y: auto; }
    .time-col {}
    .time-label {
      height: 48px; display: flex; align-items: flex-start; justify-content: flex-end;
      padding-right: 10px; padding-top: 2px; font-size: 10px; color: var(--muted); font-weight: 700;
    }
    .week-day-col { border-left: 1px solid var(--border); position: relative; }
    .week-hour { height: 48px; border-bottom: 1px solid #F0E4FC; cursor: pointer; }
    .week-hour:hover { background: var(--bg); }
    .week-ev {
      position: absolute; left: 2px; right: 2px; border-radius: 8px;
      color: #fff; font-size: 11px; padding: 3px 7px; overflow: hidden;
      cursor: pointer; z-index: 1; font-weight: 600;
    }

    /* Day view */
    #view-day { flex: 1; display: none; flex-direction: column; }
    .day-header {
      padding: 14px 24px; background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .day-header .day-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px; font-weight: 400; color: var(--purple-deep);
    }
    .day-body { display: grid; grid-template-columns: 56px 1fr; flex: 1; overflow-y: auto; }
    .day-day-col { border-left: 1px solid var(--border); position: relative; }
    .day-hour { height: 48px; border-bottom: 1px solid #F0E4FC; cursor: pointer; }
    .day-hour:hover { background: var(--bg); }
    .day-ev {
      position: absolute; left: 2px; right: 2px; border-radius: 8px;
      color: #fff; font-size: 12px; padding: 5px 8px; overflow: hidden;
      cursor: pointer; z-index: 1; font-weight: 600;
    }

    /* ── MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(74,31,110,0.45); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border-radius: 20px; padding: 28px 28px 22px;
      width: 440px; max-width: 95vw;
      box-shadow: 0 20px 60px rgba(74,31,110,0.25);
      border: 1px solid var(--border);
      position: relative; overflow: hidden;
    }
    /* subtle corner decoration */
    .modal::after {
      content: '';
      position: absolute; top: 0; right: 0;
      width: 80px; height: 80px;
      background: radial-gradient(circle at top right, rgba(232,121,168,0.12), transparent 70%);
      pointer-events: none;
    }
    .modal-title-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
    }
    .modal-title-row svg { color: var(--purple-mid); flex-shrink: 0; }
    .modal h2 {
      font-family: 'Playfair Display', serif;
      font-size: 20px; font-weight: 400; color: var(--purple-deep);
    }
    .form-row { margin-bottom: 14px; }
    .form-row label {
      display: block; font-size: 11px; font-weight: 800; color: var(--purple-mid);
      text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 5px;
    }
    .form-row input, .form-row select, .form-row textarea {
      width: 100%; padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 13px; font-family: inherit;
      background: var(--bg); color: var(--text); font-weight: 600;
    }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
      outline: none; border-color: var(--purple); box-shadow: 0 0 0 3px var(--purple-pale);
    }
    .form-row textarea { resize: vertical; min-height: 64px; }
    .form-row-inline { display: flex; gap: 12px; }
    .form-row-inline .form-row { flex: 1; }
    .recurrence-block { display: none; }
    .recurrence-block.show { display: block; }
    .color-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .color-swatch {
      width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
      border: 2.5px solid transparent; transition: transform 0.1s, border-color 0.1s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .color-swatch:hover { transform: scale(1.2); }
    .color-swatch.selected { border-color: var(--purple-deep); }
    .modal-actions {
      display: flex; justify-content: flex-end; gap: 8px;
      margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--border);
    }
    .btn-cancel {
      padding: 9px 20px; border: 1.5px solid var(--border); border-radius: 20px;
      background: transparent; cursor: pointer; font-size: 13px;
      font-family: inherit; font-weight: 700; color: var(--muted);
    }
    .btn-cancel:hover { background: var(--bg); }
    .btn-save {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 22px; border: none; border-radius: 20px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff; cursor: pointer; font-size: 13px; font-weight: 800;
      font-family: inherit;
      box-shadow: 0 4px 12px rgba(155,89,196,0.35);
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-save:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-delete {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 16px; border: 1.5px solid var(--pink); border-radius: 20px;
      background: transparent; color: var(--pink); cursor: pointer;
      font-size: 13px; font-family: inherit; font-weight: 700;
      margin-right: auto; transition: background 0.15s, color 0.15s;
    }
    .btn-delete:hover { background: var(--pink); color: #fff; }
    .btn-delete:hover svg { stroke: #fff; }

    /* ── NOTIFICATION ── */
    .notif-badge {
      position: fixed; bottom: 24px; right: 24px;
      background: linear-gradient(135deg, var(--purple-deep), var(--purple-mid));
      color: #fff; padding: 12px 18px; border-radius: 14px;
      font-size: 13px; font-weight: 700;
      box-shadow: 0 6px 24px rgba(74,31,110,0.35);
      z-index: 200; display: none; max-width: 280px;
      display: none; align-items: center; gap: 10px;
    }
    .notif-badge.show { display: flex; animation: slideup 0.25s ease; }
    @keyframes slideup {
      from { transform: translateY(12px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* decorative SVG shapes in background */
    .deco {
      position: fixed; pointer-events: none; z-index: 0;
      opacity: 0.06; user-select: none;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--purple-pale); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--purple-soft); }
  </style>
</head>

  <svg width="32" height="32" style="color:var(--pink)"><use href="#ic-paw"/></svg>

<div class="deco" style="top:68%;left:2.5%">
  <svg width="30" height="30" style="color:var(--purple-mid)"><use href="#ic-flower"/></svg>
</div>
<div class="deco" style="top:85%;left:2%">
  <svg width="28" height="28" style="color:var(--pink)"><use href="#ic-butterfly"/></svg>
</div>
<div class="deco" style="top:6%;right:1.5%">
  <svg width="32" height="32" style="color:var(--purple)"><use href="#ic-paw"/></svg>
</div>
<div class="deco" style="top:52%;right:1%">
  <svg width="34" height="34" style="color:var(--pink)"><use href="#ic-butterfly"/></svg>
</div>
<div class="deco" style="top:78%;right:2%">
  <svg width="28" height="28" style="color:var(--purple-mid)"><use href="#ic-flower"/></svg>
</div>

<!-- HEADER -->
<header>
  <div class="brand">
    <svg width="26" height="26" style="color:#F9C4E8"><use href="#ic-butterfly"/></svg>
    Calendário da <em>Angela</em>
  </div>
  <div class="header-center">
    <button class="btn-today" onclick="goToday()">Hoje</button>
    <button class="btn-nav" onclick="navigate(-1)" title="Anterior">
      <svg width="16" height="16"><use href="#ic-chevron-left"/></svg>
    </button>
    <button class="btn-nav" onclick="navigate(1)" title="Próximo">
      <svg width="16" height="16"><use href="#ic-chevron-right"/></svg>
    </button>
    <span id="month-label"></span>
  </div>
  <div class="header-right">
    <button class="view-btn active" onclick="switchView('month')">Mês</button>
    <button class="view-btn" onclick="switchView('week')">Semana</button>
    <button class="view-btn" onclick="switchView('day')">Dia</button>
  </div>
</header>

<div class="app-body">
  <!-- SIDEBAR -->
  <aside>
    <button class="btn-add" onclick="openModal()">
      <svg width="16" height="16"><use href="#ic-plus"/></svg>
      Criar evento
    </button>

    <div class="mini-cal">
      <div class="mini-cal-header">
        <button class="mini-nav" onclick="miniNavigate(-1)" title="Mês anterior">
          <svg width="14" height="14"><use href="#ic-chevron-left"/></svg>
        </button>
        <span class="mini-cal-label" id="mini-label"></span>
        <button class="mini-nav" onclick="miniNavigate(1)" title="Próximo mês">
          <svg width="14" height="14"><use href="#ic-chevron-right"/></svg>
        </button>
      </div>
      <div class="mini-grid" id="mini-grid"></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-header">
        <svg width="14" height="14" style="color:var(--purple-mid)"><use href="#ic-calendar"/></svg>
        <h3>Próximos eventos</h3>
      </div>
      <div id="upcoming-list"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main>
    <div id="view-month">
      <div class="cal-dow-row" id="dow-row"></div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div id="view-week">
      <div class="week-header-row" id="week-header"></div>
      <div class="week-body" id="week-body"></div>
    </div>
    <div id="view-day">
      <div class="day-header"><div class="day-title" id="day-header-label"></div></div>
      <div class="day-body" id="day-body"></div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title-row">
      <svg width="20" height="20" style="color:var(--pink)"><use href="#ic-star"/></svg>
      <h2 id="modal-title">Novo evento</h2>
    </div>
    <div class="form-row">
      <label>Título</label>
      <input type="text" id="ev-title" placeholder="Nome do evento" />
    </div>
    <div class="form-row-inline">
      <div class="form-row">
        <label>Data</label>
        <input type="date" id="ev-date" />
      </div>
      <div class="form-row">
        <label>Hora</label>
        <input type="time" id="ev-time" />
      </div>
    </div>
    <div class="form-row">
      <label>Repetição</label>
      <select id="ev-recurrence" onchange="toggleRecurrence()">
        <option value="none">Sem repetição</option>
        <option value="daily">Todos os dias</option>
        <option value="weekly">Toda semana</option>
        <option value="monthly">Todo mês</option>
      </select>
    </div>
    <div class="form-row recurrence-block" id="recurrence-end">
      <label>Repetir até</label>
      <input type="date" id="ev-until" />
    </div>
    <div class="form-row">
      <label>Categoria</label>
      <select id="ev-category">
        <option value="work">Trabalho</option>
        <option value="personal">Pessoal</option>
        <option value="health">Saúde</option>
        <option value="social">Social</option>
        <option value="other">Outro</option>
      </select>
    </div>
    <div class="form-row">
      <label>Cor</label>
      <div class="color-row" id="color-row"></div>
    </div>
    <div class="form-row">
      <label>Lembrete</label>
      <select id="ev-reminder">
        <option value="0">No momento</option>
        <option value="5">5 minutos antes</option>
        <option value="10">10 minutos antes</option>
        <option value="15" selected>15 minutos antes</option>
        <option value="30">30 minutos antes</option>
        <option value="60">1 hora antes</option>
        <option value="1440">1 dia antes</option>
      </select>
    </div>
    <div class="form-row">
      <label>Descrição</label>
      <textarea id="ev-desc" placeholder="Detalhes opcionais..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-delete" id="btn-delete" style="display:none" onclick="deleteEvent()">
        <svg width="14" height="14" style="stroke:var(--pink)"><use href="#ic-trash"/></svg>
        Excluir
      </button>
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveEvent()">
        <svg width="14" height="14"><use href="#ic-check"/></svg>
        Salvar
      </button>
    </div>
  </div>
</div>

<!-- NOTIFICATION -->
<div class="notif-badge" id="notif-badge">
  <svg width="16" height="16"><use href="#ic-bell"/></svg>
  <span id="notif-text"></span>
</div>

<script>
  const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DAYS_PT   = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const COLORS = ['#C060A0','#9B59C4','#E879A8','#7B3FA0','#B07ED6','#D46FBF','#8060C8','#A048B8'];
  const CAT_COLORS = { work:'#7B3FA0', personal:'#C060A0', health:'#E879A8', social:'#9B59C4', other:'#B07ED6' };

  let today       = new Date();
  let curDate     = new Date(today);
  let miniDate    = new Date(today);
  let currentView = 'month';
  let events      = JSON.parse(localStorage.getItem('angela_events') || '[]');
  let editingId   = null;
  let selectedColor = COLORS[0];
  let notifTimers = [];

  function saveStorage() { localStorage.setItem('angela_events', JSON.stringify(events)); }

  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function isSameDay(a,b) { return dateKey(a)===dateKey(b); }
  function addDays(d,n) { let x=new Date(d); x.setDate(x.getDate()+n); return x; }

  function expandEvent(ev, from, to) {
    let result=[];
    let base=new Date(ev.date+'T00:00:00');
    if (ev.recurrence==='none'||!ev.recurrence) {
      if (base>=from && base<=to) result.push({date:ev.date,ev});
      return result;
    }
    let until=ev.until?new Date(ev.until+'T00:00:00'):to;
    let cur=new Date(base);
    while (cur<=until && cur<=to) {
      if (cur>=from) result.push({date:dateKey(cur),ev});
      if      (ev.recurrence==='daily')   cur.setDate(cur.getDate()+1);
      else if (ev.recurrence==='weekly')  cur.setDate(cur.getDate()+7);
      else if (ev.recurrence==='monthly') cur.setMonth(cur.getMonth()+1);
      else break;
    }
    return result;
  }

  function getEventsForDate(dateStr) {
    let from=new Date(dateStr+'T00:00:00'), to=new Date(dateStr+'T23:59:59'), result=[];
    events.forEach(ev=>expandEvent(ev,from,to).forEach(e=>result.push({...ev,_dateKey:e.date})));
    return result;
  }

  function navigate(dir) {
    if (currentView==='month')     curDate.setMonth(curDate.getMonth()+dir);
    else if (currentView==='week') curDate.setDate(curDate.getDate()+dir*7);
    else                           curDate.setDate(curDate.getDate()+dir);
    render(); renderMini();
  }
  function goToday() { curDate=new Date(today); render(); renderMini(); }
  function miniNavigate(dir) { miniDate.setMonth(miniDate.getMonth()+dir); renderMini(); }

  function switchView(v) {
    currentView=v;
    document.querySelectorAll('.view-btn').forEach(b=>{
      const t=b.textContent.toLowerCase();
      b.classList.toggle('active',(v==='month'&&t.includes('mê'))||(v==='week'&&t.includes('sem'))||(v==='day'&&t.includes('dia')));
    });
    document.getElementById('view-month').style.display=v==='month'?'flex':'none';
    document.getElementById('view-week').style.display =v==='week' ?'flex':'none';
    document.getElementById('view-day').style.display  =v==='day'  ?'flex':'none';
    render();
  }

  function render() {
    if (currentView==='month')     renderMonth();
    else if (currentView==='week') renderWeek();
    else                           renderDay();
    renderUpcoming();
  }

  function renderMonth() {
    const y=curDate.getFullYear(), m=curDate.getMonth();
    document.getElementById('month-label').textContent=`${MONTHS_PT[m]} ${y}`;
    document.getElementById('dow-row').innerHTML=DAYS_PT.map(d=>`<div class="cal-dow">${d}</div>`).join('');
    const grid=document.getElementById('cal-grid'); grid.innerHTML='';
    const first=new Date(y,m,1), startDow=first.getDay(), dim=new Date(y,m+1,0).getDate();
    const rangeStart=new Date(y,m,1-startDow);
    const total=Math.ceil((startDow+dim)/7)*7;
    for (let i=0;i<total;i++) {
      const d=addDays(rangeStart,i), key=dateKey(d);
      const isToday=isSameDay(d,today), isOther=d.getMonth()!==m;
      const dayEvs=getEventsForDate(key);
      const cell=document.createElement('div');
      cell.className='cal-cell'+(isToday?' today':'')+(isOther?' other-month':'');
      cell.onclick=()=>{curDate=new Date(d);switchView('day');};
      let evHtml=dayEvs.slice(0,3).map(ev=>
        `<div class="cal-ev" style="background:${ev.color||CAT_COLORS[ev.category]||COLORS[0]}" onclick="event.stopPropagation();openEditModal('${ev.id}')">${ev.time?ev.time+' ':''}${ev.title}</div>`
      ).join('');
      if (dayEvs.length>3) evHtml+=`<div class="cal-ev-more">+${dayEvs.length-3} mais</div>`;
      cell.innerHTML=`<div class="day-num">${d.getDate()}</div><div class="cal-events">${evHtml}</div>`;
      grid.appendChild(cell);
    }
  }

  function getWeekStart(d) { let s=new Date(d); s.setDate(s.getDate()-s.getDay()); return s; }

  function renderWeek() {
    const ws=getWeekStart(curDate), we=addDays(ws,6);
    document.getElementById('month-label').textContent=
      `${ws.getDate()} ${MONTHS_PT[ws.getMonth()].slice(0,3)} – ${we.getDate()} ${MONTHS_PT[we.getMonth()].slice(0,3)} ${we.getFullYear()}`;
    const header=document.getElementById('week-header');
    header.innerHTML='<div></div>'+Array.from({length:7},(_,i)=>{
      const d=addDays(ws,i), isTod=isSameDay(d,today);
      return `<div class="week-header-cell${isTod?' today':''}"><div class="wday">${DAYS_PT[d.getDay()]}</div><div class="wnum">${d.getDate()}</div></div>`;
    }).join('');
    const body=document.getElementById('week-body'); body.innerHTML='';
    const timeCol=document.createElement('div'); timeCol.className='time-col';
    for (let h=0;h<24;h++) {
      const lbl=document.createElement('div'); lbl.className='time-label';
      lbl.textContent=h===0?'':`${String(h).padStart(2,'0')}:00`; timeCol.appendChild(lbl);
    }
    body.appendChild(timeCol);
    for (let i=0;i<7;i++) {
      const d=addDays(ws,i), key=dateKey(d);
      const col=document.createElement('div'); col.className='week-day-col';
      for (let h=0;h<24;h++) {
        const slot=document.createElement('div'); slot.className='week-hour';
        slot.onclick=()=>openModalAt(key,`${String(h).padStart(2,'0')}:00`);
        col.appendChild(slot);
      }
      getEventsForDate(key).forEach(ev=>{
        if (!ev.time) return;
        const [hh,mm]=ev.time.split(':').map(Number);
        const el=document.createElement('div'); el.className='week-ev';
        el.style.cssText=`top:${(hh*60+mm)/60*48}px;height:44px;background:${ev.color||CAT_COLORS[ev.category]||COLORS[0]}`;
        el.innerHTML=`<strong>${ev.time}</strong> ${ev.title}`;
        el.onclick=(e)=>{e.stopPropagation();openEditModal(ev.id);};
        col.appendChild(el);
      });
      body.appendChild(col);
    }
  }

  function renderDay() {
    const key=dateKey(curDate);
    document.getElementById('day-header-label').textContent=
      `${DAYS_PT[curDate.getDay()]}, ${curDate.getDate()} de ${MONTHS_PT[curDate.getMonth()]} de ${curDate.getFullYear()}`;
    document.getElementById('month-label').textContent=
      `${curDate.getDate()} ${MONTHS_PT[curDate.getMonth()]} ${curDate.getFullYear()}`;
    const body=document.getElementById('day-body'); body.innerHTML='';
    const timeCol=document.createElement('div'); timeCol.className='time-col';
    for (let h=0;h<24;h++) {
      const lbl=document.createElement('div'); lbl.className='time-label';
      lbl.textContent=h===0?'':`${String(h).padStart(2,'0')}:00`; timeCol.appendChild(lbl);
    }
    body.appendChild(timeCol);
    const col=document.createElement('div'); col.className='day-day-col';
    for (let h=0;h<24;h++) {
      const slot=document.createElement('div'); slot.className='day-hour';
      slot.onclick=()=>openModalAt(key,`${String(h).padStart(2,'0')}:00`);
      col.appendChild(slot);
    }
    getEventsForDate(key).forEach(ev=>{
      if (!ev.time) return;
      const [hh,mm]=ev.time.split(':').map(Number);
      const el=document.createElement('div'); el.className='day-ev';
      el.style.cssText=`top:${(hh*60+mm)/60*48}px;height:44px;background:${ev.color||CAT_COLORS[ev.category]||COLORS[0]}`;
      el.innerHTML=`<strong>${ev.time}</strong> ${ev.title}${ev.desc?'<br><span style="font-weight:400;font-size:11px">'+ev.desc+'</span>':''}`;
      el.onclick=(e)=>{e.stopPropagation();openEditModal(ev.id);};
      col.appendChild(el);
    });
    body.appendChild(col);
  }

  function renderUpcoming() {
    const list=document.getElementById('upcoming-list');
    const now=new Date(), future=new Date(now); future.setDate(future.getDate()+14);
    let items=[];
    events.forEach(ev=>{
      expandEvent(ev,now,future).forEach(e=>{
        const dt=new Date(e.date+(ev.time?'T'+ev.time:'T00:00'));
        if (dt>=now) items.push({...ev,_dt:dt,_dateKey:e.date});
      });
    });
    items.sort((a,b)=>a._dt-b._dt);
    list.innerHTML=items.slice(0,6).map(ev=>`
      <div class="upcoming-item" style="border-left-color:${ev.color||CAT_COLORS[ev.category]||COLORS[0]}" onclick="openEditModal('${ev.id}')">
        <div class="ev-title">${ev.title}</div>
        <div class="ev-time">${ev._dateKey}${ev.time?' às '+ev.time:''}</div>
      </div>`).join('')||'<div class="upcoming-empty"><svg width="13" height="13" style="color:var(--muted)"><use href="#ic-paw"/></svg> Nenhum evento próximo</div>';
  }

  function renderMini() {
    document.getElementById('mini-label').textContent=`${MONTHS_PT[miniDate.getMonth()].slice(0,3)} ${miniDate.getFullYear()}`;
    const grid=document.getElementById('mini-grid');
    grid.innerHTML=DAYS_PT.map(d=>`<div class="mini-dow">${d.slice(0,1)}</div>`).join('');
    const y=miniDate.getFullYear(), m=miniDate.getMonth();
    const first=new Date(y,m,1), startDow=first.getDay();
    const total=Math.ceil((startDow+new Date(y,m+1,0).getDate())/7)*7;
    const rangeStart=new Date(y,m,1-startDow);
    for (let i=0;i<total;i++) {
      const d=addDays(rangeStart,i);
      const el=document.createElement('div');
      el.className='mini-day'+(isSameDay(d,today)?' today':'')+(d.getMonth()!==m?' other-month':'');
      el.textContent=d.getDate();
      el.onclick=()=>{curDate=new Date(d);miniDate=new Date(d);renderMini();render();};
      grid.appendChild(el);
    }
  }

  function buildColorRow() {
    document.getElementById('color-row').innerHTML=COLORS.map(c=>
      `<div class="color-swatch${c===selectedColor?' selected':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`
    ).join('');
  }
  function pickColor(c) { selectedColor=c; buildColorRow(); }

  function openModal(dateStr,timeStr) {
    editingId=null;
    document.getElementById('modal-title').textContent='Novo evento';
    document.getElementById('ev-title').value='';
    document.getElementById('ev-date').value=dateStr||dateKey(curDate);
    document.getElementById('ev-time').value=timeStr||'';
    document.getElementById('ev-recurrence').value='none';
    document.getElementById('ev-until').value='';
    document.getElementById('ev-category').value='personal';
    document.getElementById('ev-reminder').value='15';
    document.getElementById('ev-desc').value='';
    document.getElementById('btn-delete').style.display='none';
    document.getElementById('recurrence-end').classList.remove('show');
    selectedColor=COLORS[0]; buildColorRow();
    document.getElementById('modal-overlay').classList.add('open');
    setTimeout(()=>document.getElementById('ev-title').focus(),50);
  }
  function openModalAt(dateStr,timeStr) { openModal(dateStr,timeStr); }

  function openEditModal(id) {
    const ev=events.find(e=>e.id===id); if (!ev) return;
    editingId=id;
    document.getElementById('modal-title').textContent='Editar evento';
    document.getElementById('ev-title').value=ev.title;
    document.getElementById('ev-date').value=ev.date;
    document.getElementById('ev-time').value=ev.time||'';
    document.getElementById('ev-recurrence').value=ev.recurrence||'none';
    document.getElementById('ev-until').value=ev.until||'';
    document.getElementById('ev-category').value=ev.category||'personal';
    document.getElementById('ev-reminder').value=String(ev.reminder??15);
    document.getElementById('ev-desc').value=ev.desc||'';
    document.getElementById('btn-delete').style.display='flex';
    toggleRecurrence();
    selectedColor=ev.color||COLORS[0]; buildColorRow();
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

  function toggleRecurrence() {
    document.getElementById('recurrence-end').classList.toggle('show',
      document.getElementById('ev-recurrence').value!=='none');
  }

  function saveEvent() {
    const title=document.getElementById('ev-title').value.trim();
    if (!title) { alert('Por favor, insira um título.'); return; }
    const ev={
      id: editingId||Date.now().toString(), title,
      date:       document.getElementById('ev-date').value,
      time:       document.getElementById('ev-time').value,
      recurrence: document.getElementById('ev-recurrence').value,
      until:      document.getElementById('ev-until').value,
      category:   document.getElementById('ev-category').value,
      color:      selectedColor,
      reminder:   parseInt(document.getElementById('ev-reminder').value),
      desc:       document.getElementById('ev-desc').value.trim(),
    };
    if (editingId) { const idx=events.findIndex(e=>e.id===editingId); if (idx!==-1) events[idx]=ev; }
    else events.push(ev);
    saveStorage(); closeModal(); scheduleNotifications(); render();
  }

  function deleteEvent() {
    if (!editingId) return;
    events=events.filter(e=>e.id!==editingId);
    saveStorage(); closeModal(); render();
  }

  function scheduleNotifications() {
    notifTimers.forEach(clearTimeout); notifTimers=[];
    const now=new Date(), horizon=new Date(now); horizon.setDate(horizon.getDate()+7);
    events.forEach(ev=>{
      if (!ev.time) return;
      expandEvent(ev,now,horizon).forEach(e=>{
        const evTime=new Date(e.date+'T'+ev.time);
        const notifTime=new Date(evTime.getTime()-(ev.reminder||0)*60000);
        const delay=notifTime-now;
        if (delay>0 && delay<7*24*60*60*1000) {
          notifTimers.push(setTimeout(()=>showNotification(ev),delay));
        }
      });
    });
  }

  function showNotification(ev) {
    document.getElementById('notif-text').textContent=`${ev.title} – ${ev.time}`;
    const badge=document.getElementById('notif-badge');
    badge.classList.add('show');
    setTimeout(()=>badge.classList.remove('show'),6000);
    if ('Notification' in window && Notification.permission==='granted') {
      new Notification('Calendário da Angela',{body:`${ev.title} às ${ev.time}`});
    }
  }

  document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
  document.addEventListener('keydown',e=>{
    if (e.key==='Escape') closeModal();
    if (e.key==='n' && !e.target.closest('input,textarea,select')) openModal();
  });

  switchView('month');
  renderMini();
  if ('Notification' in window && Notification.permission==='default') Notification.requestPermission();
  scheduleNotifications();

  // Register service worker for offline + PWA install
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
  }
</script>
</body>
</html>
