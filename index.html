<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Calendário da Angela</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4A1F6E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Angela">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #F9F2FF;
      --surface:     #F3EAFD;
      --purple-deep: #4A1F6E;
      --purple-mid:  #7B3FA0;
      --purple:      #9B59C4;
      --purple-soft: #C89EE0;
      --purple-pale: #EDD9FA;
      --pink:        #E879A8;
      --border:      #E2C8F5;
      --text:        #2E1445;
      --muted:       #9A7BB5;
      --hh: 56px;
      --bh: 68px;
    }

    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html { height: 100%; }

    body {
      height: 100%; overflow: hidden;
      font-family: 'Nunito', sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 16px;
    }

    /* ─── HEADER ─── */
    header {
      position: fixed; inset: 0 0 auto 0;
      height: var(--hh);
      padding-top: env(safe-area-inset-top, 0px);
      background: linear-gradient(135deg, var(--purple-deep) 0%, var(--purple-mid) 100%);
      display: flex; align-items: center;
      padding-left: 14px; padding-right: 14px;
      gap: 8px; z-index: 40;
    }

    .brand {
      flex: 1; min-width: 0;
      font-family: 'Dancing Script', cursive;
      font-size: 22px; font-weight: 700;
      color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .brand em { color: #FFC4E8; font-style: italic; }

    .h-nav { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

    .btn-icon {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.12);
      color: #fff; display: flex; align-items: center; justify-content: center;
      cursor: pointer; touch-action: manipulation;
    }
    .btn-icon:active { background: rgba(255,255,255,0.3); }

    #month-label {
      font-size: 13px; font-weight: 800; color: #fff;
      min-width: 72px; text-align: center;
    }

    .btn-today {
      height: 32px; padding: 0 12px;
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 16px; background: rgba(255,255,255,0.15);
      color: #fff; font-size: 12px; font-weight: 800;
      font-family: inherit; cursor: pointer; touch-action: manipulation;
    }
    .btn-today:active { background: rgba(255,255,255,0.35); }

    /* ─── SCROLL AREA ─── */
    .app-scroll {
      position: fixed;
      top: var(--hh);
      bottom: calc(var(--bh) + env(safe-area-inset-bottom, 0px));
      left: 0; right: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ─── MONTH VIEW ─── */
    .v-month { display: none; flex-direction: column; min-height: 100%; }
    .v-month.active { display: flex; }

    .dow-row {
      display: grid; grid-template-columns: repeat(7, 1fr);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 5;
    }
    .dow-cell {
      text-align: center; padding: 7px 0;
      font-size: 10px; font-weight: 800; color: var(--purple-mid);
      text-transform: uppercase; letter-spacing: 0.05em;
    }

    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      flex: 1;
    }
    .cal-cell {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      min-height: 64px; padding: 3px 2px;
      background: var(--surface);
      display: flex; flex-direction: column;
      cursor: pointer; touch-action: manipulation;
      user-select: none;
    }
    .cal-cell:active { background: var(--purple-pale); }
    .cal-cell.other { background: #FAF5FF; }
    .cal-cell.other .d-num { color: #D0B8E8; }

    .d-num {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: var(--purple-mid);
      align-self: center;
    }
    .cal-cell.today .d-num {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff; font-weight: 800;
    }

    .dot-row {
      display: flex; justify-content: center; gap: 2px;
      flex-wrap: wrap; margin-top: 2px; padding: 0 2px;
    }
    .ev-dot {
      width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
    }

    /* ─── DAY VIEW ─── */
    .v-day { display: none; flex-direction: column; }
    .v-day.active { display: flex; }

    .day-hdr {
      padding: 12px 16px 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 15px; font-weight: 800; color: var(--purple-deep);
    }

    .day-timeline {
      display: grid;
      grid-template-columns: 40px 1fr;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
    }
    .t-labels {}
    .t-label {
      height: 52px;
      display: flex; align-items: flex-start; justify-content: flex-end;
      padding: 3px 6px 0 0;
      font-size: 10px; font-weight: 700; color: var(--muted);
    }
    .t-slots { border-left: 1px solid var(--border); position: relative; }
    .t-slot {
      height: 52px; border-bottom: 1px solid #EFE5FA;
      cursor: pointer; touch-action: manipulation;
    }
    .t-slot:active { background: var(--purple-pale); }
    .day-ev {
      position: absolute; left: 4px; right: 4px;
      border-radius: 10px; color: #fff;
      padding: 5px 8px; font-size: 13px; font-weight: 700;
      overflow: hidden; cursor: pointer; z-index: 2;
      touch-action: manipulation;
    }

    /* ─── AGENDA VIEW ─── */
    .v-agenda { display: none; flex-direction: column; padding: 14px; gap: 8px; }
    .v-agenda.active { display: flex; }

    .ag-date-label {
      font-size: 11px; font-weight: 800;
      color: var(--purple-mid); text-transform: uppercase;
      letter-spacing: 0.06em; margin: 8px 0 4px; padding-left: 2px;
    }
    .ag-item {
      background: var(--surface); border-radius: 14px;
      border-left: 4px solid var(--pink);
      padding: 12px 14px; margin-bottom: 4px;
      cursor: pointer; touch-action: manipulation;
      box-shadow: 0 1px 5px rgba(74,31,110,0.08);
    }
    .ag-item:active { opacity: 0.8; }
    .ag-title { font-size: 15px; font-weight: 800; }
    .ag-time  { font-size: 12px; color: var(--muted); margin-top: 3px; font-weight: 600; }

    .ag-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; padding: 60px 20px; text-align: center;
      color: var(--muted);
    }
    .ag-empty svg { opacity: 0.25; }
    .ag-empty p { font-size: 14px; font-weight: 700; }

    /* ─── BOTTOM NAV ─── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(var(--bh) + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: #fff;
      border-top: 1px solid var(--border);
      display: flex; align-items: stretch;
      z-index: 40;
    }
    .bn-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      border: none; background: none; font-family: inherit;
      cursor: pointer; touch-action: manipulation; padding: 6px 0 4px;
      color: var(--muted);
    }
    .bn-item span { font-size: 10px; font-weight: 800; }
    .bn-item.active { color: var(--purple-mid); }
    .bn-item.active svg { color: var(--pink); }

    .bn-add {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding-top: 2px;
      border: none; background: none; cursor: pointer; touch-action: manipulation;
    }
    .add-circle {
      width: 50px; height: 50px; border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 14px rgba(155,89,196,0.45);
      margin-top: -14px;
    }
    .bn-add span { font-size: 10px; font-weight: 800; color: var(--muted); margin-top: 2px; }

    /* ─── MODAL SHEET ─── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(46,20,69,0.55); z-index: 80;
      align-items: flex-end;
    }
    .overlay.open { display: flex; }

    .sheet {
      width: 100%; max-height: 94vh;
      background: var(--surface);
      border-radius: 22px 22px 0 0;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      box-shadow: 0 -6px 30px rgba(74,31,110,0.2);
      animation: rise 0.26s cubic-bezier(.3,0,.2,1);
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    }
    @keyframes rise {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .sheet-handle {
      width: 38px; height: 4px; border-radius: 2px;
      background: var(--purple-soft); margin: 10px auto 0;
    }
    .sheet-body { padding: 14px 18px 4px; }

    .sheet-title {
      font-size: 19px; font-weight: 800; color: var(--purple-deep);
      margin-bottom: 18px;
    }

    .f-row { margin-bottom: 13px; }
    .f-row label {
      display: block; font-size: 11px; font-weight: 800;
      color: var(--purple-mid); text-transform: uppercase;
      letter-spacing: 0.07em; margin-bottom: 5px;
    }
    .f-row input,
    .f-row select,
    .f-row textarea {
      width: 100%; padding: 13px 14px;
      border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 16px; font-family: inherit;
      background: var(--bg); color: var(--text); font-weight: 600;
      -webkit-appearance: none; appearance: none;
    }
    .f-row input:focus,
    .f-row select:focus,
    .f-row textarea:focus {
      outline: none; border-color: var(--purple);
      box-shadow: 0 0 0 3px var(--purple-pale);
    }
    .f-row textarea { resize: none; height: 78px; }

    .f-2col { display: flex; gap: 10px; }
    .f-2col .f-row { flex: 1; }

    .recur-extra { display: none; }
    .recur-extra.show { display: block; }

    .color-swatches { display: flex; gap: 10px; flex-wrap: wrap; }
    .swatch {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid transparent;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
      cursor: pointer; touch-action: manipulation;
    }
    .swatch.on { border-color: var(--purple-deep); }

    .sheet-actions {
      display: flex; gap: 10px;
      padding: 14px 18px 0;
      border-top: 1px solid var(--border); margin-top: 6px;
    }
    .btn-cancel {
      flex: 1; padding: 14px; border-radius: 13px;
      border: 1.5px solid var(--border); background: transparent;
      font-size: 15px; font-family: inherit; font-weight: 700;
      color: var(--muted); cursor: pointer; touch-action: manipulation;
    }
    .btn-save {
      flex: 2; padding: 14px; border-radius: 13px; border: none;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff; font-size: 15px; font-weight: 800;
      font-family: inherit; cursor: pointer; touch-action: manipulation;
      box-shadow: 0 4px 14px rgba(155,89,196,0.4);
    }
    .btn-del {
      padding: 14px 16px; border-radius: 13px;
      border: 1.5px solid var(--pink); background: transparent;
      color: var(--pink); font-size: 15px; font-weight: 700;
      font-family: inherit; cursor: pointer; touch-action: manipulation;
      display: none; align-items: center; gap: 6px;
    }
    .btn-del.show { display: flex; }
    .btn-del:active { background: var(--pink); color: #fff; }

    /* ─── TOAST ─── */
    .toast {
      display: none; position: fixed;
      top: calc(var(--hh) + 8px); left: 14px; right: 14px;
      background: var(--purple-deep); color: #fff;
      padding: 13px 16px; border-radius: 13px;
      font-size: 14px; font-weight: 700; gap: 10px;
      box-shadow: 0 4px 20px rgba(74,31,110,0.4);
      z-index: 90; align-items: center;
    }
    .toast.show { display: flex; animation: td .22s ease; }
    @keyframes td {
      from { opacity:0; transform:translateY(-6px); }
      to   { opacity:1; transform:translateY(0); }
    }
  </style>
</head>
<body>

<!-- SVG SPRITE -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="18" rx="3"/>
    <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
    <line x1="3" y1="10" x2="21" y2="10"/>
  </symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <polyline points="12 7 12 12 15 14"/>
  </symbol>
  <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
    <line x1="8" y1="18" x2="21" y2="18"/>
    <circle cx="3" cy="6" r="1" fill="currentColor"/>
    <circle cx="3" cy="12" r="1" fill="currentColor"/>
    <circle cx="3" cy="18" r="1" fill="currentColor"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </symbol>
  <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="3 6 5 6 21 6"/>
    <path d="M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V4h6v2"/>
  </symbol>
  <symbol id="i-chev-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 18 9 12 15 6"/>
  </symbol>
  <symbol id="i-chev-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="9 18 15 12 9 6"/>
  </symbol>
  <symbol id="i-butterfly" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 12C10 8 4 6 3 9s4 5 9 3z"/>
    <path d="M12 12c2-4 8-6 9-3s-4 5-9 3z"/>
    <path d="M12 12c-2 4-7 6-8 3s3-4 8-3z"/>
    <path d="M12 12c2 4 7 6 8 3s-3-4-8-3z"/>
    <line x1="12" y1="10" x2="12" y2="14"/>
  </symbol>
</svg>

<!-- HEADER -->
<header>
  <div class="brand">
    <svg width="20" height="20" style="vertical-align:middle;margin-right:6px;color:#FFC4E8"><use href="#i-butterfly"/></svg>Calendário da <em>Angela</em>
  </div>
  <div class="h-nav">
    <button class="btn-today" onclick="goToday()">Hoje</button>
    <button class="btn-icon" onclick="nav(-1)" aria-label="Anterior">
      <svg width="16" height="16"><use href="#i-chev-l"/></svg>
    </button>
    <span id="month-label"></span>
    <button class="btn-icon" onclick="nav(1)" aria-label="Próximo">
      <svg width="16" height="16"><use href="#i-chev-r"/></svg>
    </button>
  </div>
</header>

<!-- SCROLL CONTAINER -->
<div class="app-scroll" id="app-scroll">

  <!-- MONTH -->
  <div class="v-month active" id="v-month">
    <div class="dow-row" id="dow-row"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <!-- DAY -->
  <div class="v-day" id="v-day">
    <div class="day-hdr" id="day-hdr"></div>
    <div class="day-timeline" id="day-timeline"></div>
  </div>

  <!-- AGENDA -->
  <div class="v-agenda" id="v-agenda">
    <div id="agenda-inner"></div>
  </div>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="bn-item active" id="bn-month" onclick="setView('month')">
    <svg width="22" height="22"><use href="#i-cal"/></svg>
    <span>Mês</span>
  </button>
  <button class="bn-item" id="bn-day" onclick="setView('day')">
    <svg width="22" height="22"><use href="#i-clock"/></svg>
    <span>Dia</span>
  </button>
  <button class="bn-add" onclick="openNew()">
    <div class="add-circle">
      <svg width="24" height="24" style="color:#fff"><use href="#i-plus"/></svg>
    </div>
    <span>Novo</span>
  </button>
  <button class="bn-item" id="bn-agenda" onclick="setView('agenda')">
    <svg width="22" height="22"><use href="#i-list"/></svg>
    <span>Agenda</span>
  </button>
  <button class="bn-item" onclick="openNew()">
    <svg width="22" height="22"><use href="#i-bell"/></svg>
    <span>Lemb.</span>
  </button>
</nav>

<!-- MODAL SHEET -->
<div class="overlay" id="overlay" onclick="overlayTap(event)">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-body">
      <div class="sheet-title" id="sheet-title">Novo evento</div>

      <div class="f-row">
        <label>Título *</label>
        <input id="f-title" type="text" placeholder="Nome do evento" autocomplete="off"/>
      </div>

      <div class="f-2col">
        <div class="f-row">
          <label>Data</label>
          <input id="f-date" type="date"/>
        </div>
        <div class="f-row">
          <label>Hora</label>
          <input id="f-time" type="time"/>
        </div>
      </div>

      <div class="f-row">
        <label>Repetição</label>
        <select id="f-recur" onchange="toggleRecur()">
          <option value="none">Sem repetição</option>
          <option value="daily">Diariamente</option>
          <option value="weekly">Semanalmente</option>
          <option value="monthly">Mensalmente</option>
        </select>
      </div>
      <div class="f-row recur-extra" id="recur-extra">
        <label>Repetir até</label>
        <input id="f-until" type="date"/>
      </div>

      <div class="f-row">
        <label>Categoria</label>
        <select id="f-cat">
          <option value="personal">Pessoal</option>
          <option value="work">Trabalho</option>
          <option value="health">Saúde</option>
          <option value="social">Social</option>
          <option value="faculdade">Faculdade</option>
          <option value="other">Outro</option>
        </select>
      </div>

      <div class="f-row">
        <label>Cor</label>
        <div class="color-swatches" id="color-swatches"></div>
      </div>

      <div class="f-row">
        <label>Lembrete</label>
        <select id="f-remind">
          <option value="0">No momento</option>
          <option value="5">5 min antes</option>
          <option value="15" selected>15 min antes</option>
          <option value="30">30 min antes</option>
          <option value="60">1 hora antes</option>
          <option value="1440">1 dia antes</option>
        </select>
      </div>

      <div class="f-row">
        <label>Descrição</label>
        <textarea id="f-desc" placeholder="Notas opcionais..."></textarea>
      </div>
    </div>

    <div class="sheet-actions">
      <button class="btn-del" id="btn-del" onclick="deleteEv()">
        <svg width="15" height="15"><use href="#i-trash"/></svg>
        Excluir
      </button>
      <button class="btn-cancel" onclick="closeSheet()">Cancelar</button>
      <button class="btn-save" onclick="saveEv()">Salvar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <svg width="16" height="16"><use href="#i-bell"/></svg>
  <span id="toast-text"></span>
</div>

<script>
/* ── constants ── */
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MSHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DSHORT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DLONG  = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const COLORS = ['#C060A0','#9B59C4','#E879A8','#7B3FA0','#B07ED6','#D46FBF','#5DA8A0','#E07050','#D4A800','#F0C800'];
const CAT_CLR = {work:'#7B3FA0',personal:'#C060A0',health:'#E879A8',social:'#9B59C4',faculdade:'#D4A800',other:'#B07ED6'};

/* ── state ── */
let today  = new Date();
let cursor = new Date(today);
let view   = 'month';
let events = load();
let editId = null;
let selClr = COLORS[0];
let ntTimers = [];

function load() { try { return JSON.parse(localStorage.getItem('ae') || '[]'); } catch { return []; } }
function save()  { localStorage.setItem('ae', JSON.stringify(events)); }

function dk(d) { return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function p2(n) { return String(n).padStart(2,'0'); }
function sameDay(a,b) { return dk(a)===dk(b); }
function addD(d,n) { let x=new Date(d); x.setDate(x.getDate()+n); return x; }

/* expand recurring events into a date range */
function expand(ev, from, to) {
  const base = new Date(ev.date+'T00:00:00');
  if (!ev.recur || ev.recur==='none') {
    return base>=from && base<=to ? [ev.date] : [];
  }
  const until = ev.until ? new Date(ev.until+'T00:00:00') : to;
  const res=[]; let cur=new Date(base);
  while (cur<=until && cur<=to) {
    if (cur>=from) res.push(dk(cur));
    if      (ev.recur==='daily')   cur.setDate(cur.getDate()+1);
    else if (ev.recur==='weekly')  cur.setDate(cur.getDate()+7);
    else if (ev.recur==='monthly') cur.setMonth(cur.getMonth()+1);
    else break;
  }
  return res;
}

function eventsOn(dateStr) {
  const f=new Date(dateStr+'T00:00:00'), t=new Date(dateStr+'T23:59:59'), out=[];
  events.forEach(ev => { if (expand(ev,f,t).length) out.push(ev); });
  return out;
}

/* ── navigation ── */
function nav(d) {
  if (view==='month') cursor.setMonth(cursor.getMonth()+d);
  else                cursor.setDate(cursor.getDate()+d);
  render();
}
function goToday() { cursor=new Date(today); render(); }

/* ── view switching ── */
function setView(v) {
  view=v;
  ['month','day','agenda'].forEach(n=>{
    document.getElementById('v-'+n).classList.toggle('active', n===v);
    const bn=document.getElementById('bn-'+n);
    if (bn) bn.classList.toggle('active', n===v);
  });
  render();
}

/* ── label ── */
function updateLabel() {
  let t='';
  if (view==='month') t=`${MSHORT[cursor.getMonth()]} ${cursor.getFullYear()}`;
  else if (view==='day') t=`${cursor.getDate()} ${MSHORT[cursor.getMonth()]}`;
  else t='Agenda';
  document.getElementById('month-label').textContent=t;
}

/* ── render dispatch ── */
function render() {
  updateLabel();
  if (view==='month')  renderMonth();
  else if (view==='day') renderDay();
  else                 renderAgenda();
}

/* ── MONTH ── */
function renderMonth() {
  const y=cursor.getFullYear(), m=cursor.getMonth();
  // dow headers (1 letter)
  document.getElementById('dow-row').innerHTML =
    DSHORT.map(d=>`<div class="dow-cell">${d[0]}</div>`).join('');

  const grid=document.getElementById('cal-grid'); grid.innerHTML='';
  const first=new Date(y,m,1), dow=first.getDay(), dim=new Date(y,m+1,0).getDate();
  const start=addD(first,-dow), cells=Math.ceil((dow+dim)/7)*7;

  for (let i=0;i<cells;i++) {
    const d=addD(start,i), key=dk(d), other=d.getMonth()!==m;
    const isToday=sameDay(d,today);
    const evs=eventsOn(key);

    const cell=document.createElement('div');
    cell.className='cal-cell'+(other?' other':'')+(isToday?' today':'');
    cell.onclick=()=>{ cursor=new Date(d); setView('day'); };

    const dots = evs.slice(0,5).map(ev=>
      `<div class="ev-dot" style="background:${ev.color||CAT_CLR[ev.cat]||COLORS[0]}"></div>`
    ).join('');

    cell.innerHTML=`<div class="d-num">${d.getDate()}</div><div class="dot-row">${dots}</div>`;
    grid.appendChild(cell);
  }
}

/* ── DAY ── */
function renderDay() {
  const key=dk(cursor);
  document.getElementById('day-hdr').textContent=
    `${DLONG[cursor.getDay()]}, ${cursor.getDate()} de ${MONTHS[cursor.getMonth()]}`;

  const tl=document.getElementById('day-timeline'); tl.innerHTML='';

  // time labels column
  const lcol=document.createElement('div'); lcol.className='t-labels';
  for (let h=0;h<24;h++) {
    const l=document.createElement('div'); l.className='t-label';
    l.textContent = h===0 ? '' : `${p2(h)}:00`;
    lcol.appendChild(l);
  }
  tl.appendChild(lcol);

  // slots column
  const scol=document.createElement('div'); scol.className='t-slots';
  for (let h=0;h<24;h++) {
    const s=document.createElement('div'); s.className='t-slot';
    s.onclick=()=>openNew(key, `${p2(h)}:00`);
    scol.appendChild(s);
  }

  // event blocks
  eventsOn(key).forEach(ev=>{
    if (!ev.time) return;
    const [hh,mm]=ev.time.split(':').map(Number);
    const el=document.createElement('div'); el.className='day-ev';
    el.style.cssText=`top:${(hh*60+mm)/60*52}px;height:50px;background:${ev.color||CAT_CLR[ev.cat]||COLORS[0]}`;
    el.textContent=`${ev.time}  ${ev.title}`;
    el.onclick=(e)=>{e.stopPropagation();openEdit(ev.id);};
    scol.appendChild(el);
  });

  tl.appendChild(scol);
}

/* ── AGENDA ── */
function renderAgenda() {
  const now=new Date(), horizon=addD(now,60);
  let items=[];
  events.forEach(ev=>{
    expand(ev,now,horizon).forEach(d=>{
      const dt=new Date(d+(ev.time?'T'+ev.time:'T00:00'));
      if (dt>=now) items.push({...ev,_dt:dt,_dk:d});
    });
  });
  items.sort((a,b)=>a._dt-b._dt);

  const inner=document.getElementById('agenda-inner');
  if (!items.length) {
    inner.innerHTML=`<div class="ag-empty">
      <svg width="48" height="48"><use href="#i-cal"/></svg>
      <p>Nenhum evento próximo</p>
      <p style="font-size:12px;opacity:0.65">Toque em + para criar um evento</p>
    </div>`;
    return;
  }

  const groups={};
  items.forEach(ev=>{ (groups[ev._dk]=groups[ev._dk]||[]).push(ev); });

  inner.innerHTML = Object.entries(groups).map(([d,evs])=>{
    const dt=new Date(d+'T12:00:00');
    const lbl = sameDay(dt,today) ? 'Hoje' :
                sameDay(dt,addD(today,1)) ? 'Amanhã' :
                `${DSHORT[dt.getDay()]}, ${dt.getDate()} de ${MONTHS[dt.getMonth()]}`;
    return `<div class="ag-date-label">${lbl}</div>`+
      evs.map(ev=>`<div class="ag-item" style="border-left-color:${ev.color||CAT_CLR[ev.cat]||COLORS[0]}"
        onclick="openEdit('${ev.id}')">
        <div class="ag-title">${ev.title}</div>
        <div class="ag-time">${ev.time||'Dia todo'}${ev.desc?' · '+ev.desc:''}</div>
      </div>`).join('');
  }).join('');
}

/* ── MODAL ── */
function buildSwatches() {
  document.getElementById('color-swatches').innerHTML = COLORS.map(c=>
    `<div class="swatch${c===selClr?' on':''}" style="background:${c}" onclick="pickClr('${c}')"></div>`
  ).join('');
}
function pickClr(c) { selClr=c; buildSwatches(); }

function openNew(dateStr, timeStr) {
  editId=null;
  document.getElementById('sheet-title').textContent='Novo evento';
  document.getElementById('f-title').value='';
  document.getElementById('f-date').value=dateStr||dk(cursor);
  document.getElementById('f-time').value=timeStr||'';
  document.getElementById('f-recur').value='none';
  document.getElementById('f-until').value='';
  document.getElementById('f-cat').value='personal';
  document.getElementById('f-remind').value='15';
  document.getElementById('f-desc').value='';
  document.getElementById('btn-del').classList.remove('show');
  document.getElementById('recur-extra').classList.remove('show');
  selClr=COLORS[0]; buildSwatches();
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(),300);
}

function openEdit(id) {
  const ev=events.find(e=>e.id===id); if(!ev) return;
  editId=id;
  document.getElementById('sheet-title').textContent='Editar evento';
  document.getElementById('f-title').value=ev.title;
  document.getElementById('f-date').value=ev.date;
  document.getElementById('f-time').value=ev.time||'';
  document.getElementById('f-recur').value=ev.recur||'none';
  document.getElementById('f-until').value=ev.until||'';
  document.getElementById('f-cat').value=ev.cat||'personal';
  document.getElementById('f-remind').value=String(ev.remind??15);
  document.getElementById('f-desc').value=ev.desc||'';
  document.getElementById('btn-del').classList.add('show');
  toggleRecur();
  selClr=ev.color||COLORS[0]; buildSwatches();
  document.getElementById('overlay').classList.add('open');
}

function closeSheet() { document.getElementById('overlay').classList.remove('open'); }

function overlayTap(e) { if (e.target===document.getElementById('overlay')) closeSheet(); }

function toggleRecur() {
  document.getElementById('recur-extra').classList.toggle('show',
    document.getElementById('f-recur').value!=='none');
}

function saveEv() {
  const title=document.getElementById('f-title').value.trim();
  if (!title) { alert('Por favor, insira um título.'); return; }
  const ev={
    id:    editId||String(Date.now()),
    title,
    date:  document.getElementById('f-date').value,
    time:  document.getElementById('f-time').value,
    recur: document.getElementById('f-recur').value,
    until: document.getElementById('f-until').value,
    cat:   document.getElementById('f-cat').value,
    color: selClr,
    remind:parseInt(document.getElementById('f-remind').value),
    desc:  document.getElementById('f-desc').value.trim(),
  };
  if (editId) { const i=events.findIndex(e=>e.id===editId); if(i!==-1) events[i]=ev; }
  else events.push(ev);
  save(); closeSheet(); scheduleNotifs(); render();
}

function deleteEv() {
  if (!editId||!confirm('Excluir este evento?')) return;
  events=events.filter(e=>e.id!==editId);
  save(); closeSheet(); render();
}

/* ── notifications ── */
function scheduleNotifs() {
  ntTimers.forEach(clearTimeout); ntTimers=[];
  const now=new Date(), h=addD(now,7);
  events.forEach(ev=>{
    if (!ev.time) return;
    expand(ev,now,h).forEach(d=>{
      const t=new Date(d+'T'+ev.time);
      const fire=new Date(t.getTime()-(ev.remind||0)*60000);
      const ms=fire-now;
      if (ms>0) ntTimers.push(setTimeout(()=>showToast(ev),ms));
    });
  });
}

function showToast(ev) {
  document.getElementById('toast-text').textContent=`${ev.title}${ev.time?' às '+ev.time:''}`;
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),5000);
  if (Notification?.permission==='granted')
    new Notification('Calendário da Angela',{body:`${ev.title}${ev.time?' às '+ev.time:''}`,icon:'./icon-192.png'});
}

/* ── swipe gesture ── */
let swX=0;
document.getElementById('app-scroll').addEventListener('touchstart',e=>{swX=e.touches[0].clientX;},{passive:true});
document.getElementById('app-scroll').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-swX;
  if (Math.abs(dx)>55) nav(dx<0?1:-1);
},{passive:true});

/* ── boot ── */
render();
if (Notification?.permission==='default') Notification.requestPermission();
scheduleNotifs();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
